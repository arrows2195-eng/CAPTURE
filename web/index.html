<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPTURE - Screen Recording</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Quick Bar (Compact Overlay) -->
    <div id="quickBar" class="quick-bar collapsed" role="toolbar" aria-label="Capture quick controls">
        <div class="quick-bar-main">
            <div class="status-indicator" id="statusIndicator">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text" id="statusText">IDLE</span>
            </div>
            <button class="icon-btn expand-btn" id="expandBtn" aria-label="Expand controls" aria-expanded="false">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline id="expandIcon" points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
        </div>
        <div class="quick-bar-expanded" id="quickBarExpanded" aria-hidden="true">
            <button class="action-btn" id="freezeBtn" aria-label="Toggle freeze">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="6" y="4" width="4" height="16"></rect>
                    <rect x="14" y="4" width="4" height="16"></rect>
                </svg>
                <span>Freeze</span>
            </button>
            <button class="action-btn secondary" id="settingsBtn" aria-label="Open settings">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span>Settings</span>
            </button>
        </div>
    </div>

    <!-- Settings Panel (Side Panel) -->
    <div id="settingsPanel" class="settings-panel hidden" role="dialog" aria-label="Capture settings" aria-modal="false">
        <div class="settings-header">
            <h2>Capture Settings</h2>
            <button class="icon-btn close-btn" id="closeSettingsBtn" aria-label="Close settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="settings-content">
            <!-- Capture Controls Section -->
            <section class="settings-section">
                <h3>Capture Controls</h3>
                <div class="btn-group">
                    <button class="btn btn-primary" id="startBtn" aria-label="Start capture">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <span>Start</span>
                    </button>
                    <button class="btn btn-danger" id="stopBtn" aria-label="Stop capture" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="6" y="6" width="12" height="12"></rect>
                        </svg>
                        <span>Stop</span>
                    </button>
                </div>
                <div class="btn-group">
                    <button class="btn btn-secondary" id="freezeBtnMain" aria-label="Toggle freeze">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="6" y="4" width="4" height="16"></rect>
                            <rect x="14" y="4" width="4" height="16"></rect>
                        </svg>
                        <span id="freezeBtnText">Freeze</span>
                    </button>
                    <button class="btn btn-secondary" id="cursorBtn" aria-label="Toggle fake cursor">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 3l-7 7 3 3 12-12-3-3-7 7z"></path>
                            <path d="M3 21l7-7 12 12"></path>
                        </svg>
                        <span>Cursor</span>
                    </button>
                    <button class="btn btn-secondary" id="gameModeBtn" aria-label="Toggle game mode">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="2" y1="2" x2="22" y2="22"></line>
                            <path d="M22 2l-7 20-4-9-9-4 20-7z"></path>
                            <path d="M6 6l6 6"></path>
                        </svg>
                        <span>Game Mode</span>
                    </button>
                </div>
            </section>

            <!-- FPS Range Section -->
            <section class="settings-section">
                <h3>FPS Range</h3>
                <div class="input-group">
                    <label for="fpsMin">Min FPS</label>
                    <input type="number" id="fpsMin" min="1" max="60" value="8" step="1">
                </div>
                <div class="input-group">
                    <label for="fpsMax">Max FPS</label>
                    <input type="number" id="fpsMax" min="1" max="60" value="15" step="1">
                </div>
            </section>

            <!-- Quality Section -->
            <section class="settings-section">
                <h3>Quality</h3>
                <div class="slider-group">
                    <label for="quality">JPEG Quality: <span id="qualityValue">75</span>%</label>
                    <input type="range" id="quality" min="1" max="100" value="75">
                </div>
                <div class="preset-btns">
                    <button class="preset-btn" data-quality="30">Low</button>
                    <button class="preset-btn" data-quality="60">Medium</button>
                    <button class="preset-btn active" data-quality="75">High</button>
                    <button class="preset-btn" data-quality="90">Ultra</button>
                </div>
            </section>

            <!-- Pixelation Section -->
            <section class="settings-section">
                <h3>Pixelation</h3>
                <div class="slider-group">
                    <label for="pixelation">Level: <span id="pixelationValue">1x</span></label>
                    <input type="range" id="pixelation" min="1" max="16" value="1" step="1">
                </div>
                <div class="preset-btns">
                    <button class="preset-btn active" data-pixel="1">1x</button>
                    <button class="preset-btn" data-pixel="2">2x</button>
                    <button class="preset-btn" data-pixel="4">4x</button>
                    <button class="preset-btn" data-pixel="8">8x</button>
                    <button class="preset-btn" data-pixel="16">16x</button>
                </div>
            </section>

            <!-- Region Section -->
            <section class="settings-section">
                <h3>Capture Region</h3>
                <div class="region-inputs">
                    <div class="input-group">
                        <label>X</label>
                        <input type="number" id="regionX" min="0" max="9999" value="0" step="1">
                    </div>
                    <div class="input-group">
                        <label>Y</label>
                        <input type="number" id="regionY" min="0" max="9999" value="0" step="1">
                    </div>
                    <div class="input-group">
                        <label>Width</label>
                        <input type="number" id="regionW" min="64" max="9999" value="1920" step="1">
                    </div>
                    <div class="input-group">
                        <label>Height</label>
                        <input type="number" id="regionH" min="64" max="9999" value="1080" step="1">
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-secondary" id="showRegionBtn" aria-label="Show region selector">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <span>Show</span>
                    </button>
                    <button class="btn btn-secondary" id="hideRegionBtn" aria-label="Hide region selector">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                        <span>Hide</span>
                    </button>
                </div>
                <div class="preset-btns region-presets">
                    <button class="preset-btn" data-preset="1920,1080">1080p</button>
                    <button class="preset-btn" data-preset="1280,720">720p</button>
                    <button class="preset-btn" data-preset="960,540">540p</button>
                    <button class="preset-btn" data-preset="640,480">VGA</button>
                </div>
            </section>

            <!-- Status Section -->
            <section class="settings-section">
                <h3>Status</h3>
                <div class="status-display" id="statusDisplay">
                    <span class="status-badge" id="statusBadge">IDLE</span>
                </div>
            </section>
        </div>
    </div>

    <!-- Region Selector Overlay -->
    <div id="regionSelector" class="region-selector hidden" role="dialog" aria-label="Region selector">
        <div class="region-frame" id="regionFrame">
            <div class="region-handle nw" data-handle="nw"></div>
            <div class="region-handle n" data-handle="n"></div>
            <div class="region-handle ne" data-handle="ne"></div>
            <div class="region-handle w" data-handle="w"></div>
            <div class="region-handle e" data-handle="e"></div>
            <div class="region-handle sw" data-handle="sw"></div>
            <div class="region-handle s" data-handle="s"></div>
            <div class="region-handle se" data-handle="se"></div>
            <div class="region-info" id="regionInfo">1920 x 1080</div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
